<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5b1429"/>
      <stop offset=".48" stop-color="#3b0d1d"/>
      <stop offset="1" stop-color="#210812"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b86c83" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#6b2940" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d99aaa" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#fff9fb"/>
      <stop offset=".55" stop-color="#f0dfe5"/>
      <stop offset="1" stop-color="#cfa5b3"/>
    </linearGradient>
    <linearGradient id="crossbar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dfa5b7"/>
      <stop offset=".5" stop-color="#fff0f4"/>
      <stop offset="1" stop-color="#ba7189"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".25" cy=".12" r=".9">
      <stop stop-color="#d87896" stop-opacity=".19"/>
      <stop offset="1" stop-color="#d87896" stop-opacity="0"/>
    </radialGradient>
    <filter id="letterShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#16070c"/>
  <rect x="13" y="13" width="486" height="486" rx="101" fill="url(#burgundy)" stroke="url(#frame)" stroke-width="3"/>
  <rect x="25" y="25" width="462" height="462" rx="91" fill="url(#sheen)"/>
  <rect x="31" y="31" width="450" height="450" rx="84" fill="none" stroke="#f9dce5" stroke-opacity=".055" stroke-width="2"/>

  <ellipse cx="256" cy="350" rx="101" ry="15" fill="#16060b" opacity=".42"/>
  <g filter="url(#letterShadow)">
    <path d="M163 353 L234 157 Q245 128 256 128 Q267 128 278 157 L349 353
             Q351 360 343 360 H314 Q307 360 304 352 L285 297 H227 L208 352
             Q205 360 198 360 H169 Q161 360 163 353 Z
             M239 263 H273 L256 213 Z"
          fill="url(#letter)" fill-rule="evenodd" stroke="#fff5f8" stroke-opacity=".75" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M224 278 H288" stroke="url(#crossbar)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <path d="M89 129 Q123 92 166 82" fill="none" stroke="#d98ca5" stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
  <path d="M346 430 Q388 417 416 382" fill="none" stroke="#d98ca5" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="390" cy="119" r="4" fill="#e5acbd" opacity=".8"/>
  <circle cx="121" cy="383" r="4" fill="#d78aa2" opacity=".65"/>
</svg>