<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>اختبار الموقع — طلب تلقائي</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: #160f16; color: #f8f1f6; font-family: system-ui, sans-serif; }
    main { width: min(100%, 520px); box-sizing: border-box; padding: 26px; border: 1px solid #67445e; border-radius: 22px; background: #241724; box-shadow: 0 16px 50px #0005; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { line-height: 1.8; color: #e0d2df; }
    button { border: 0; border-radius: 12px; padding: 13px 18px; font: inherit; font-weight: 700; cursor: pointer; background: #e5b6dc; color: #281528; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #result { overflow-wrap: anywhere; padding: 12px; border-radius: 10px; background: #160f16; min-height: 28px; }
    small { color: #cbb8c9; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>اختبار تحديد الموقع</h1>
    <p>ستطلب هذه الصفحة إذن الموقع تلقائيًا عند فتحها. لن يتم إرسال إحداثياتك إلى خادم أو إلى أي شخص؛ ستظهر على هذه الصفحة فقط بعد سماح المتصفح.</p>
    <p id="result" role="status" aria-live="polite">جارٍ طلب إذن الموقع من المتصفح…</p>
    <button id="retry" type="button" hidden>إعادة المحاولة</button>
    <small>إذا كان الإذن محظورًا، افتح إعدادات الموقع في المتصفح واسمح به يدويًا. لا يمكن للصفحة تجاوز رفض الإذن.</small>
  </main>
  <script>
    const result = document.getElementById('result');
    const retry = document.getElementById('retry');
    let requestInProgress = false;

    function requestLocation() {
      if (requestInProgress) return;
      if (!window.isSecureContext) {
        result.textContent = 'هذه الصفحة ليست في سياق آمن. افتحها عبر HTTPS.';
        retry.hidden = false;
        return;
      }
      if (!navigator.geolocation) {
        result.textContent = 'المتصفح لا يدعم تحديد الموقع.';
        retry.hidden = false;
        return;
      }

      requestInProgress = true;
      retry.hidden = true;
      result.textContent = 'جارٍ انتظار استجابة المتصفح…';
      navigator.geolocation.getCurrentPosition(
        position => {
          const c = position.coords;
          result.textContent = 'تم تحديد الموقع على هذا الجهاز فقط. خط العرض: ' +
            c.latitude.toFixed(6) + ' — خط الطول: ' + c.longitude.toFixed(6) +
            ' — الدقة التقديرية: ' + Math.round(c.accuracy) + ' متر. لم تُرسل البيانات إلى أي مكان.';
          requestInProgress = false;
        },
        error => {
          const messages = {
            1: 'المتصفح لم يسمح بالوصول للموقع أو أن الإذن محظور. يمكنك السماح به من إعدادات الموقع في المتصفح ثم إعادة المحاولة.',
            2: 'تعذر تحديد الموقع على هذا الجهاز حاليًا. تأكد من تفعيل خدمات الموقع.',
            3: 'انتهت مهلة تحديد الموقع. يمكنك إعادة المحاولة.'
          };
          result.textContent = messages[error.code] || 'تعذر تحديد الموقع.';
          requestInProgress = false;
          retry.hidden = false;
        },
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 0 }
      );
    }

    retry.addEventListener('click', requestLocation);
    window.addEventListener('load', requestLocation, { once: true });
  </script>
</body>
</html>
