<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOMA ACADEMY — Admin</title>
<style>
body{margin:0;background:#0d0a0b;color:#f5eef0;font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 40px));background:#171113;border:1px solid #38272c;border-radius:20px;padding:30px;box-shadow:0 20px 60px #0008}.logo{font-size:25px;font-weight:900;letter-spacing:.08em}.logo span{color:#b83b59}.muted{color:#a99ba0}label{display:block;font-size:12px;color:#a99ba0;margin:16px 0 7px}input{width:100%;box-sizing:border-box;background:#100c0e;color:#f5eef0;border:1px solid #38272c;border-radius:10px;padding:12px;outline:none}.btn{width:100%;margin-top:18px;border:0;border-radius:10px;padding:11px 14px;background:#7d1f38;color:#fff;font-weight:700;cursor:pointer}.error{color:#ff8aa0;margin-top:14px;font-size:13px;line-height:1.6}.ok{color:#9be0bc;margin-top:14px;font-size:13px;line-height:1.6}.debug{margin-top:18px;padding:12px;border:1px solid #38272c;border-radius:10px;background:#100c0e;font-size:12px;display:none}.debug b{color:#fff}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
<div class="logo">DOMA <span>ACADEMY</span></div>
<p class="muted">Admin Control Panel</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" value="admin@domaacademy.com" required>
<label>Password</label><input id="password" type="password" required autofocus>
<button class="btn">Login</button>
<div id="loginError" class="error"></div>
<div id="debug" class="debug"></div>
</form>
</div>
<script>
const SB_URL='https://dtptxhkcogpoleftguas.supabase.co';
const SB_KEY='sb_publishable_uAwbJjn1AZuTJKTQzlD1-g__DJkZFyL';
const db=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

async function checkStaffDirect(){
  const {data:{user},error:userError}=await db.auth.getUser();
  if(userError) return {ok:false,reason:'auth_user',message:userError.message};
  if(!user) return {ok:false,reason:'not_logged_in',message:'No authenticated user.'};

  // IMPORTANT: Do not call doma_check_staff here. The previous file depended on
  // an RPC whose existence/return shape was not verified. The screenshot confirms
  // this user's profile row exists and role=admin, so read that row directly.
  const {data:profile,error:profileError}=await db
    .from('profiles')
    .select('id,email,full_name,role')
    .eq('id',user.id)
    .maybeSingle();

  if(profileError) return {ok:false,reason:'profile_query',message:profileError.message,user,profile:null};
  if(!profile) return {ok:false,reason:'missing_profile',message:'No profile row was returned for this Auth user.',user,profile:null};
  if(!['admin','teacher'].includes(profile.role)) return {ok:false,reason:'wrong_role',message:'Profile role is '+profile.role,user,profile};
  return {ok:true,user,profile};
}

function showDebug(x){
  const p=x.profile;
  $('debug').style.display='block';
  $('debug').innerHTML='<b>Connection check</b><br>Auth email: '+esc(x.user?.email||'—')+'<br>User ID: '+esc(x.user?.id||'—')+'<br>Profile ID: '+esc(p?.id||'—')+'<br>Profile role: '+esc(p?.role||'—');
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginError').textContent='';$('debug').style.display='none';
  const email=$('email').value.trim();
  const password=$('password').value;
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){$('loginError').textContent=error.message;return;}

  const staff=await checkStaffDirect();
  if(!staff.ok){
    showDebug(staff);
    if(staff.reason==='profile_query'){
      $('loginError').innerHTML='Login succeeded, but the Admin page cannot read your <b>profiles</b> row.<br><br>Supabase is blocking the profile SELECT request. This is an RLS/permission issue, not an Admin-role issue.';
    }else if(staff.reason==='missing_profile'){
      $('loginError').innerHTML='Login succeeded, but no profile row was returned for this Auth user.';
    }else if(staff.reason==='wrong_role'){
      $('loginError').innerHTML='Login succeeded, but the profile role is <b>'+esc(staff.profile?.role||'unknown')+'</b>, not admin/teacher.';
    }else{
      $('loginError').textContent=staff.message||'Unable to verify Admin access.';
    }
    return;
  }

  // Keep the session alive and send the user to the actual Admin file.
  // This page is intentionally a login bridge so it can diagnose the exact issue.
  $('loginError').className='ok';
  $('loginError').textContent='Admin verified successfully. Open your main DOMA ACADEMY Admin file now; the same Supabase session is active.';
  showDebug(staff);
});
</script>
</body>
</html>
