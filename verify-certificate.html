<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a1028">
<title>التحقق من الشهادة | DOMA Academy</title>
<meta name="description" content="تحقق من صحة شهادات أكاديمية DOMA باستخدام رقم الشهادة أو رمز QR.">
<style>
:root{color-scheme:dark;--gold:#d6b477;--purple:#281a3d;--muted:#c7b8d5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:radial-gradient(circle at 15% 10%,#49305f 0,transparent 35%),linear-gradient(145deg,#120d1e,#21142f 55%,#17101f);font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#f8f1e8;display:grid;place-items:center}
main{width:min(100%,650px);border:1px solid #d6b47755;border-radius:24px;padding:clamp(22px,5vw,42px);background:#ffffff0b;backdrop-filter:blur(18px);box-shadow:0 24px 80px #0006}
.brand{text-align:center;color:var(--gold);font-weight:800;letter-spacing:3px;font-size:13px}
h1{text-align:center;margin:14px 0 8px;font-size:clamp(25px,5vw,34px)}.intro{text-align:center;color:var(--muted);line-height:1.8;margin:0 0 26px}
form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1 1 250px;min-width:0;border:1px solid #d6b47766;border-radius:14px;background:#130d20;color:white;padding:15px;font-size:16px;direction:ltr;text-align:left}button{border:0;border-radius:14px;padding:14px 22px;background:linear-gradient(135deg,#f1d49a,#b98b4b);color:#26172d;font-weight:800;cursor:pointer}
#status{margin-top:18px;color:var(--muted);min-height:26px;text-align:center}.result{display:none;margin-top:22px;padding:22px;border:1px solid #d6b47766;border-radius:18px;background:#0f0b18aa}.result.valid{display:block}.result h2{color:#d9c08f;margin:0 0 18px;font-size:22px}.row{padding:12px 0;border-bottom:1px solid #ffffff18}.row:last-child{border:0}.label{display:block;color:#bca9ce;font-size:12px;margin-bottom:5px}.value{font-weight:700;overflow-wrap:anywhere}.invalid{color:#ffb5ad}.valid-label{color:#a7e3bd}.foot{text-align:center;margin-top:24px;font-size:12px;color:#aa9bb9}.foot a{color:var(--gold)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <div class="brand">DOMA ACADEMY</div>
  <h1>التحقق من الشهادة</h1>
  <p class="intro">اكتب رقم الشهادة الموجود أسفلها، أو افتح الرابط مباشرةً من رمز QR للتأكد من بيانات الإصدار.</p>
  <form id="verifyForm">
    <input id="certificateCode" name="code" autocomplete="off" maxlength="80" placeholder="DOMA-XXXXXXXX" aria-label="رقم الشهادة" required>
    <button type="submit">تحقق من الشهادة</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="result" class="result" aria-live="polite">
    <h2 class="valid-label">✓ شهادة صالحة ومسجلة</h2>
    <div class="row"><span class="label">اسم المتعلم</span><span class="value" id="studentName"></span></div>
    <div class="row"><span class="label">المسار</span><span class="value" id="trackTitle"></span></div>
    <div class="row"><span class="label">رقم الشهادة</span><span class="value" id="verifiedCode"></span></div>
    <div class="row"><span class="label">تاريخ الإصدار</span><span class="value" id="issuedAt"></span></div>
  </section>
  <div class="foot">إذا لم تظهر نتيجة، راجع رقم الشهادة أو تواصل مع <a href="./index.html">DOMA Academy</a>.</div>
</main>
<script>
(function(){
  const SUPABASE_URL='https://dtptxhkcogpoleftguas.supabase.co';
  const SUPABASE_KEY='sb_publishable_uAwbJjn1AZuTJKTQzlD1-g__DJkZFyL';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  const form=document.getElementById('verifyForm'),input=document.getElementById('certificateCode'),status=document.getElementById('status'),result=document.getElementById('result');
  const params=new URLSearchParams(location.search);const initial=params.get('code');if(initial)input.value=initial;
  form.addEventListener('submit',async function(event){
    event.preventDefault();result.style.display='none';result.classList.remove('valid');
    const code=input.value.trim();if(code.length<8||code.length>80){status.textContent='رقم الشهادة غير مكتمل.';status.className='invalid';return}
    status.textContent='جاري التحقق…';status.className='';
    try{
      const {data,error}=await db.rpc('programming_lookup_certificate',{p_code:code});
      if(error)throw error;
      const certificate=Array.isArray(data)?data[0]:null;
      if(!certificate){status.textContent='لم نعثر على شهادة بهذا الرقم. راجع الرقم وحاول مرة أخرى.';status.className='invalid';return}
      document.getElementById('studentName').textContent=certificate.student_name||'—';
      document.getElementById('trackTitle').textContent=certificate.track_title||'—';
      document.getElementById('verifiedCode').textContent=certificate.certificate_code||code;
      document.getElementById('issuedAt').textContent=certificate.issued_at?new Date(certificate.issued_at).toLocaleDateString('ar-EG'):'—';
      result.style.display='block';result.classList.add('valid');status.textContent='تم العثور على سجل الشهادة بنجاح.';status.className='valid-label';
    }catch(error){status.textContent='تعذر التحقق حاليًا. حاول مرة أخرى لاحقًا.';status.className='invalid';console.error('[certificate-verify]',error&&error.name||'Error')}
  });
  if(initial)form.requestSubmit();
})();
</script>
</body>
</html>
