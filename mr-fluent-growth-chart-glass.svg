<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142747"/><stop offset=".38" stop-color="#09172e"/>
      <stop offset=".72" stop-color="#061126"/><stop offset="1" stop-color="#11182f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff8ff"/><stop offset=".16" stop-color="#9ab9da"/>
      <stop offset=".38" stop-color="#f8fbff"/><stop offset=".62" stop-color="#53749f"/>
      <stop offset=".82" stop-color="#9baecc"/><stop offset="1" stop-color="#263d61"/>
    </linearGradient>
    <linearGradient id="innerEdge" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#d9f3ff" stop-opacity=".7"/><stop offset=".3" stop-color="#5983b3" stop-opacity=".3"/>
      <stop offset="1" stop-color="#9b5dfb" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="barOne" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f0fdff"/><stop offset=".42" stop-color="#9cd9ff"/><stop offset="1" stop-color="#4a83fa"/>
    </linearGradient>
    <linearGradient id="barTwo" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#f1c6ff"/><stop offset=".42" stop-color="#a68bff"/><stop offset="1" stop-color="#603cff"/>
    </linearGradient>
    <linearGradient id="barThree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d3ff"/><stop offset=".34" stop-color="#ae78ff"/>
      <stop offset=".72" stop-color="#7337f7"/><stop offset="1" stop-color="#4325c7"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe7ff"/><stop offset=".34" stop-color="#ad9bff"/>
      <stop offset=".72" stop-color="#f36bff"/><stop offset="1" stop-color="#e39aff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".29"/><stop offset=".28" stop-color="#a6d8ff" stop-opacity=".1"/>
      <stop offset=".7" stop-color="#847aff" stop-opacity=".025"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
