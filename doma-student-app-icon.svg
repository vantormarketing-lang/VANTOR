<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#35101f"/>
      <stop offset=".52" stop-color="#17101f"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e6cfff"/>
      <stop offset=".48" stop-color="#9871ef"/>
      <stop offset="1" stop-color="#63e0b1"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#e9dfff"/>
      <stop offset="1" stop-color="#b6f8dc"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bda0ff"/>
      <stop offset="1" stop-color="#5bd7a9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#07080d"/>
  <rect x="13" y="13" width="486" height="486" rx="112" fill="url(#shell)" stroke="#453151" stroke-width="2"/>
  <circle cx="256" cy="248" r="185" fill="#a37bff" opacity=".045"/>
  <circle cx="256" cy="248" r="165" fill="none" stroke="url(#edge)" stroke-width="5"/>
  <circle cx="256" cy="248" r="151" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
  <path d="M126 201 C126 159 160 130 205 130 H310 C354 130 386 158 386 200 V247 C386 289 354 317 310 317 H264 L220 360 V317 H205 C160 317 126 289 126 247 Z"
        fill="#17101f" fill-opacity=".68" stroke="url(#bubble)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M164 269 V194 Q164 181 177 181 H188 Q201 181 201 194 V243 L244 200 Q256 188 268 200 L311 243 V194 Q311 181 324 181 H335 Q348 181 348 194 V269 Q348 283 334 283 H324 Q316 283 309 276 L256 224 L203 276 Q196 283 188 283 H178 Q164 283 164 269 Z"
        fill="url(#letter)" stroke="#fffaff" stroke-opacity=".86" stroke-width="2" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M181 304 Q255 332 330 304" fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#glow)">
    <circle cx="365" cy="150" r="11" fill="#69e4b4" stroke="#e1fff1" stroke-width="3"/>
    <path d="M117 117 L122 130 L135 135 L122 140 L117 153 L112 140 L99 135 L112 130 Z" fill="#d7c5ff"/>
  </g>
  <circle cx="392" cy="351" r="5" fill="#8d72da"/>
  <circle cx="112" cy="337" r="4" fill="#67dbae"/>
</svg>