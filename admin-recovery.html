<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>استعادة حساب الأدمن الأساسي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#38205e 0,transparent 40%),linear-gradient(145deg,#100d20,#211333 60%,#120e20);font-family:Tahoma,Arial,sans-serif;color:#f8f4ff}.panel{width:min(100%,480px);padding:28px;border:1px solid #b99b5b66;border-radius:22px;background:#ffffff0d;backdrop-filter:blur(18px);box-shadow:0 20px 70px #0007}h1{font-size:23px;margin:0 0 10px;color:#e6c77d}p{line-height:1.8;color:#ddd4ea;font-size:14px}label{display:block;margin:18px 0 7px;font-size:14px}input{width:100%;padding:13px;border:1px solid #b99b5b66;border-radius:12px;background:#120f20;color:white;font-size:16px;outline:none}input:focus{border-color:#e6c77d}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(100deg,#b58b45,#ead49b);color:#24182a;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.notice{margin-top:16px;padding:12px;border-radius:12px;background:#0003;white-space:pre-wrap;line-height:1.7;font-size:14px}.small{font-size:12px;color:#bfb4d0}
</style>
</head>
<body>
<main class="panel">
<h1>استعادة حساب الأدمن الأساسي</h1>
<p>هذه صفحة مؤقتة لتعيين كلمة مرور جديدة لحساب DOMA Admin الحالي. لا تشارك رمز الاستعادة أو كلمة المرور مع أي شخص.</p>
<form id="recoveryForm">
<label for="secret">رمز الاستعادة الذي أضفته في Cloudflare</label>
<input id="secret" type="password" autocomplete="off" required minlength="32">
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
<label for="confirm">تأكيد كلمة المرور</label>
<input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
<button id="submit" type="submit">تعيين كلمة المرور الجديدة</button>
</form>
<div id="status" class="notice" role="status" aria-live="polite" hidden></div>
<p class="small">بعد نجاح العملية، احذف متغير ADMIN_RECOVERY_SECRET وصفحة الاستعادة والوظيفة المؤقتة من المشروع.</p>
</main>
<script>
const form=document.getElementById('recoveryForm');
const statusBox=document.getElementById('status');
const submit=document.getElementById('submit');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const secret=document.getElementById('secret').value;
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 statusBox.hidden=false;
 if(password!==confirm){statusBox.textContent='كلمتا المرور غير متطابقتين.';return;}
 if(password.length<12){statusBox.textContent='استخدم كلمة مرور من 12 حرفًا على الأقل.';return;}
 submit.disabled=true;statusBox.textContent='جارٍ تحديث كلمة المرور...';
 try{
  const response=await fetch('/api/admin/recover-primary-admin',{method:'POST',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify({recovery_secret:secret,password})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.ok)throw new Error(data.error||'تعذّر إتمام العملية. راجع إعدادات الاستعادة.');
  statusBox.textContent='تم تعيين كلمة المرور الجديدة بنجاح. احذف الآن ADMIN_RECOVERY_SECRET من Cloudflare، ثم احذف ملفات الاستعادة المؤقتة من GitHub.';
  form.reset();
 }catch(error){statusBox.textContent=error.message||'حدث خطأ غير متوقع.';}
 finally{submit.disabled=false;}
});
</script>
</body>
</html>
